<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTF Toolkit — {% block title %}Dashboard{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="auth-required" content="{{ '1' if require_auth else '0' }}">
  <meta name="auth-token" content="{{ auth_token }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"></script>
  <script>
    // Auto-inject the CSRF token into every POST form and HTMX request so the
    // security middleware (double-submit cookie) is always satisfied.
    (function () {
      var csrfMeta = document.querySelector('meta[name="csrf-token"]');
      var csrf = csrfMeta ? csrfMeta.getAttribute('content') : '';
      var authMeta = document.querySelector('meta[name="auth-token"]');
      var authTok = authMeta ? authMeta.getAttribute('content') : '';
      var authReq = document.querySelector('meta[name="auth-required"]');

      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('form').forEach(function (form) {
          if (form.querySelector('input[name="csrf"]')) return;
          var f = form.method || '';
          var method = f.toLowerCase() === 'get' ? 'get' : form.querySelector('[name="_method"]') ? 'post' : 'post';
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'csrf';
          input.value = csrf;
          form.appendChild(input);
        });
      });

      function addHeaders() {
        var headers = { 'X-CSRF-Token': csrf };
        if (authReq && authReq.getAttribute('content') === '1' && authTok) {
          headers['X-Auth-Token'] = authTok;
        }
        return headers;
      }

      if (window.htmx) {
        htmx.config.defaultHeaders = Object.assign(htmx.config.defaultHeaders || {}, addHeaders());
      }
    })();
  </script>
  <style>
    :root {
      --bg:       #0d0f14;
      --surface:  #13161e;
      --border:   #1f2535;
      --text:     #cdd6f4;
      --dim:      #6c7086;
      --accent:   #89b4fa;   /* blue */
      --green:    #a6e3a1;
      --yellow:   #f9e2af;
      --red:      #f38ba8;
      --cyan:     #89dceb;
      --purple:   #cba6f7;
      --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
      --font-sans: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 200px;
      min-width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .sidebar-logo {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo .logo-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .04em;
    }
    .sidebar-logo .logo-sub {
      font-size: 10px;
      color: var(--dim);
      margin-top: 2px;
    }
    .ws-badge {
      margin: 10px 12px;
      background: var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .ws-badge .ws-label { color: var(--dim); font-size: 10px; }
    .ws-badge .ws-name  { color: var(--yellow); }

    .workspace-select {
      width: 140px;
      padding: 4px 8px;
      font-size: 12px;
    }

    nav { flex: 1; padding: 8px 0; }
    nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      color: var(--dim);
      text-decoration: none;
      font-size: 13px;
      transition: color .15s, background .15s;
      border-left: 2px solid transparent;
    }
    nav a:hover { color: var(--text); background: var(--border); }
    nav a.active { color: var(--accent); border-left-color: var(--accent); background: rgba(137,180,250,.07); }
    nav .nav-icon { width: 16px; text-align: center; font-style: normal; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--dim);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
    }
    .topbar-title {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 12px;
    }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }

    /* ── Form elements ── */
    input[type="text"], input[type="number"], select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 7px 10px;
      width: 100%;
      outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    label { display: block; font-size: 11px; color: var(--dim); margin-bottom: 4px; margin-top: 10px; }
    label:first-child { margin-top: 0; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: var(--bg); font-weight: 600; }
    .btn-ghost   { background: var(--border); color: var(--text); }
    .btn-danger  { background: var(--red); color: var(--bg); }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; }
    th { text-align: left; color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 7px 10px; border-bottom: 1px solid rgba(31,37,53,.6); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .badge-open   { background: rgba(166,227,161,.15); color: var(--green); }
    .badge-recon  { background: rgba(137,180,250,.15); color: var(--accent); }
    .badge-crypto { background: rgba(203,166,247,.15); color: var(--purple); }
    .badge-web    { background: rgba(249,226,175,.15); color: var(--yellow); }
    .badge-forensic { background: rgba(137,220,235,.15); color: var(--cyan); }

    /* ── Tool catalog ── */
    .badge-binary { background: rgba(166,227,161,.15); color: var(--green); }
    .badge-stego  { background: rgba(243,139,168,.15); color: var(--red); }
    .badge-osint  { background: rgba(250,189,87,.15); color: #fabd2f; }
    .badge-misc   { background: rgba(108,112,134,.15); color: var(--dim); }
    .badge-src    { background: rgba(137,180,250,.08); color: var(--dim); border: 1px solid var(--border); }
    .badge-missing { background: rgba(243,139,168,.15); color: var(--red); }
    .badge-na     { background: rgba(108,112,134,.15); color: var(--dim); }

    .tool-row {
      border-bottom: 1px solid rgba(31,37,53,.6);
      padding: 10px 2px;
    }
    .tool-row:last-child { border-bottom: none; }
    .tool-row-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tool-name-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tool-name { font-family: var(--font-mono); font-size: 13px; color: var(--text); font-weight: 600; }
    .tool-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .tool-desc { font-size: 12px; color: var(--dim); margin-top: 4px; }
    .tool-meta { font-size: 11px; color: var(--dim); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .tool-meta a { color: var(--accent); text-decoration: none; }
    .tool-meta a:hover { text-decoration: underline; }
    .mono-tiny { font-family: var(--font-mono); font-size: 10px; color: var(--dim); word-break: break-all; }
    .tool-log { margin-top: 8px; }
    .tool-log summary { font-family: var(--font-mono); font-size: 11px; color: var(--accent); cursor: pointer; }
    .btn-tiny { padding: 3px 10px; font-size: 11px; }
    .noselect { user-select: none; }

    /* ── Code / mono blocks ── */
    .mono-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--green);
      max-height: 300px;
      overflow-y: auto;
    }

    /* ── HTMX loading indicator ── */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; color: var(--dim); font-size: 12px; }

    /* ── Sidebar shortcuts / controls ── */
    .nav-disabled {
      opacity: .35;
      pointer-events: none;
    }
    .workspace-switcher {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .workspace-switcher form {
      display: flex;
      gap: 6px;
    }
    .workspace-switcher select {
      width: 140px;
      padding: 4px 8px;
      font-size: 12px;
    }
    .workspace-switcher .btn-compact {
      padding: 4px 10px;
      font-size: 11px;
    }

    /* ── Stat boxes ── */
    .stat-box { text-align: center; padding: 16px; }
    .stat-box .stat-value { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-box .stat-label { font-size: 11px; color: var(--dim); margin-top: 4px; }

    /* ── Flag ── */
    .flag-value {
      font-family: var(--font-mono);
      color: var(--yellow);
      background: rgba(249,226,175,.08);
      padding: 4px 8px;
      border-radius: 3px;
    }

    /* ── Error / success ── */
    .msg-error   { color: var(--red); font-family: var(--font-mono); font-size: 12px; }
    .msg-success { color: var(--green); font-family: var(--font-mono); font-size: 12px; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-title">CTF-TOOLKIT</div>
      <div class="logo-sub">v0.1.0 — local</div>
    </div>

    <div class="ws-badge">
      <div class="ws-label">workspace</div>
      <div class="ws-name">{{ active_ws | default('default') }}</div>
    </div>

    <nav>
      <a href="/"         class="{% if request.url.path == '/' %}active{% endif %}">
        <i class="nav-icon">⊞</i> Dashboard</a>
      <a href="/recon/"   class="{% if '/recon' in request.url.path %}active{% endif %}">
        <i class="nav-icon">◎</i> Recon</a>
      <a href="#" class="nav-disabled" aria-disabled="true" tabindex="-1">
        <i class="nav-icon">⬡</i> Web</a>
      <a href="/crypto/"  class="{% if '/crypto' in request.url.path %}active{% endif %}">
        <i class="nav-icon">⊕</i> Crypto</a>
      <a href="/forensic/" class="{% if '/forensic' in request.url.path %}active{% endif %}">
        <i class="nav-icon">⊘</i> Forensic</a>
      <a href="/tools/"    class="{% if '/tools' in request.url.path %}active{% endif %}">
        <i class="nav-icon">◱</i> Tools</a>
      <a href="#" class="nav-disabled" aria-disabled="true" tabindex="-1">
        <i class="nav-icon">⊗</i> Reverse</a>
      <a href="#" class="nav-disabled" aria-disabled="true" tabindex="-1">
        <i class="nav-icon">◈</i> Pwn</a>
    </nav>

    <div class="sidebar-footer">
      localhost:8080
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title">{% block topbar_title %}CTF Toolkit{% endblock %}</span>
      <div class="workspace-switcher">
        <form method="POST" action="/workspace/switch">
          <select name="name" class="workspace-select" title="Select workspace" aria-label="Select workspace">
            {% for ws in workspaces | default([]) %}
              <option value="{{ ws.name }}" {% if ws.name == active_ws %}selected{% endif %}>{{ ws.name }}</option>
            {% endfor %}
          </select>
          <button class="btn btn-ghost btn-compact" type="submit">Switch</button>
        </form>
      </div>
    </div>

    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>

</body>
</html>
