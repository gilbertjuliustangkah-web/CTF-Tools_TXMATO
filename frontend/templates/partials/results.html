{% if results %}
<table>
  <thead>
    <tr><th>Module</th><th>Target</th><th>Time</th></tr>
  </thead>
  <tbody>
    {% for r in results %}
    <tr>
      <td><span class="badge badge-{{ r.module }}">{{ r.module }}</span></td>
      <td>{{ r.target }}</td>
      <td style="color:var(--dim)">{{ r.created_at[:16] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p style="color:var(--dim);font-size:12px">No results yet.</p>
{% endif %}
