{% if results %}
<table>
  <thead>
    <tr><th>Module</th><th>Target</th><th>Time</th></tr>
  </thead>
  <tbody>
    {% for r in results %}
    <tr>
      <td><span class="badge badge-{{ r.module }}">{{ r.module }}</span></td>
      <td>{{ r.target }}</td>
      <td class="c-dim">{{ r.created_at[:16] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="c-dim f-12">No results yet.</p>
{% endif %}
