[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-toolkit"
version = "0.1.0"
description = "CTF Toolkit - Unified CLI + Web Dashboard"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aiofiles>=23",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2",
    "aiosqlite>=0.20",
]

[project.scripts]
ctf = "ctf.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ctf*"]
